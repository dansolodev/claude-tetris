<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">MODO CLARO</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" aria-label="Alternar modo claro/oscuro" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <label class="label" for="skin-select">SKIN</label>
          <select id="skin-select" class="skin-select">
            <option value="retro">Retro</option>
            <option value="neon">Neon</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel art</option>
          </select>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <nav class="menu" data-show="pause">
          <button class="menu-btn" id="resume-btn">Reanudar</button>
          <button class="menu-btn" id="pause-restart-btn">Reiniciar</button>
          <button class="menu-btn" id="controls-btn">Ver controles</button>
        </nav>

        <div class="menu-controls" data-show="controls">
          <ul>
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Space</kbd></span> caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
          </ul>
          <button class="menu-btn" id="controls-back-btn">Volver</button>
        </div>

        <div class="level-picker" data-show="pause gameover">
          <span class="label">NIVEL INICIAL</span>
          <div class="stepper">
            <button class="step-btn" id="level-down" aria-label="Bajar nivel inicial">−</button>
            <span class="value" id="start-level" aria-live="polite">1</span>
            <button class="step-btn" id="level-up" aria-label="Subir nivel inicial">+</button>
          </div>
          <span class="hint" data-show="pause">Se aplica en la próxima partida</span>
        </div>

        <button id="restart-btn" data-show="gameover">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
